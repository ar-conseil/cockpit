<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff">
  <title>Cockpit · Antonin Rouzier</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icone-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cockpit">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Playpen+Sans:wght@600;700&family=Montserrat:wght@600;700&family=Barlow+Condensed:wght@700&family=Anton&family=Bodoni+Moda:opsz,wght@6..96,500&display=swap">
  <link rel="stylesheet" href="assets/style.css?v=20261111d">
</head>
<body>
  <div class="coquille" id="nav" hidden>
    <aside class="cote" id="cote" aria-label="Menu">
      <div class="cote-haut">
        <a class="espace" href="#" aria-label="Aujourd'hui"><span class="espace-logo">AR</span><span class="espace-nom"><b>Cockpit</b><small>Antonin Rouzier</small></span></a>
        <button type="button" class="btn-icone fermer-menu" id="fermer-menu" aria-label="Fermer le menu"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
      </div>
      <div class="cote-actions">
        <button type="button" class="cote-bouton principal" id="btn-ajout" title="Nouvelle tâche (touche N)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg><span>Nouvelle tâche</span><kbd>N</kbd></button>
        <button type="button" class="cote-bouton" id="btn-rdv" title="Nouveau rendez-vous (touche R)"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="10" rx="2"/><path d="M2.5 6.5h11M5.5 2v3M10.5 2v3"/></svg><span>Rendez-vous</span><kbd>R</kbd></button>
      </div>
      <nav class="cote-liens" id="projets" aria-label="Navigation"></nav>
      <div class="cote-bas">
        <button type="button" class="direct" id="btn-synchro" title="Relire tous les agendas maintenant"><i></i><span id="etat-synchro">En direct</span></button>
        <button type="button" class="btn-texte" id="deconnexion" title="Se déconnecter">Quitter</button>
      </div>
    </aside>
    <div class="voile" id="voile"></div>
    <header class="barre-haut" id="barre-haut">
      <button type="button" class="btn-icone ouvrir-menu" id="ouvrir-menu" aria-label="Ouvrir le menu" aria-controls="cote" aria-expanded="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/></svg></button>
      <nav class="fil" id="fil" aria-label="Fil d'Ariane"></nav>
      <form class="dis-victor" id="dis-victor" role="search" aria-label="Demander à Victor" autocomplete="off">
        <button type="button" class="dis-victor-micro" id="dis-victor-micro" aria-label="Parler à Victor (micro)" title="Parler à Victor"><span class="dis-victor-onde" aria-hidden="true"><i></i><i></i><i></i><i></i></span></button>
        <input id="dis-victor-champ" type="text" enterkeyhint="send" spellcheck="true" maxlength="500"
          placeholder="Demande à Victor : une tâche, un rendez-vous, un mail…" aria-label="Demande pour Victor">
        <kbd title="Appuyer sur / pour écrire ou dicter (Wispr Flow)">/</kbd>
        <button type="submit" aria-label="Envoyer à Victor"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5"/></svg></button>
        <span class="dis-victor-compte" aria-hidden="true"></span>
      </form>
      <div class="victor-reponse" id="victor-reponse" role="status" aria-live="polite" hidden></div>
      <span class="horloge-haut" id="horloge-haut"></span>
      <button type="button" class="btn-icone ajout-mobile" id="btn-ajout-mobile" aria-label="Nouvelle tâche"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
    </header>
  </div>

  <section class="connexion" id="connexion" hidden>
    <form class="form-connexion" id="form-connexion" autocomplete="on">
      <p class="surtitre">Antonin Rouzier</p>
      <h1>Cockpit</h1>
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label for="mot-de-passe">Mot de passe</label>
      <input id="mot-de-passe" name="password" type="password" autocomplete="current-password" required>
      <button type="submit" class="btn-plein">Entrer</button>
      <button type="button" class="btn-texte" id="oubli">Mot de passe oublié</button>
      <p class="message" id="message-connexion" role="status" aria-live="polite"></p>
      <p class="pied-connexion">Outil personnel d'Antonin Rouzier · <a href="confidentialite.html">Politique de confidentialité</a></p>
    </form>
  </section>

  <main id="app" hidden></main>

  <dialog id="ajout-rapide" class="dialogue">
    <form method="dialog" id="form-ajout">
      <p class="surtitre">Nouvelle tâche</p>
      <input id="ajout-titre" name="titre" type="text" placeholder="Que faut-il faire ?" required autocomplete="off">
      <div class="rangee">
        <select id="ajout-activite" name="activite" aria-label="Projet"></select>
        <input id="ajout-echeance" name="echeance" type="date" aria-label="Échéance">
        <select id="ajout-priorite" name="priorite" aria-label="Priorité">
          <option value="haute">Priorité haute</option><option value="moyenne" selected>Priorité normale</option><option value="basse">Priorité basse</option>
        </select>
      </div>
      <div class="rangee fin">
        <button type="button" class="btn-texte" id="ajout-annuler">Annuler</button>
        <button type="submit" class="btn-plein">Ajouter</button>
      </div>
    </form>
  </dialog>

  <dialog id="rdv" class="dialogue">
    <form method="dialog" id="form-rdv">
      <p class="surtitre" id="rdv-surtitre">Rendez-vous</p>
      <input id="rdv-titre" type="text" placeholder="Titre du rendez-vous" required autocomplete="off" aria-label="Titre">
      <div class="rangee">
        <label class="champ"><span>Jour</span><input id="rdv-jour" type="date" required></label>
        <label class="champ"><span>Début</span><input id="rdv-debut" type="time" step="300"></label>
        <label class="champ"><span>Fin</span><input id="rdv-fin" type="time" step="300"></label>
        <label class="champ case"><input id="rdv-journee" type="checkbox"> <span>Toute la journée</span></label>
      </div>
      <input id="rdv-lieu" type="text" placeholder="Lieu ou lien de visio" autocomplete="off" aria-label="Lieu">
      <div class="rangee">
        <label class="champ"><span>Agenda</span><select id="rdv-agenda"></select></label>
        <label class="champ"><span>Projet</span><select id="rdv-projet"></select></label>
      </div>
      <p class="vide" id="rdv-info"></p>
      <div class="rangee fin">
        <button type="button" class="btn-texte danger" id="rdv-supprimer">Supprimer</button>
        <span class="espace"></span>
        <button type="button" class="btn-texte" id="rdv-annuler">Annuler</button>
        <button type="submit" class="btn-plein" id="rdv-ok">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/app.js?v=20261111d"></script>
</body>
</html>

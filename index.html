<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Cockpit AR Conseil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <a class="brand" href="#" aria-label="Cockpit AR Conseil, vue d'ensemble">
        <span class="brand-rule" aria-hidden="true"><i></i><b>✦</b><i></i></span>
        <span class="brand-name">AR Conseil</span>
        <span class="brand-rule" aria-hidden="true"><i></i><b>✦</b><i></i></span>
      </a>
      <p class="today" id="today"></p>
      <button type="button" class="deconnexion" id="deconnexion" hidden>Se déconnecter</button>
    </div>
    <nav class="tabs" id="tabs" aria-label="Activités" hidden></nav>
  </header>

  <section class="connexion page" id="connexion" hidden>
    <form class="carte-connexion" id="form-connexion" autocomplete="on">
      <h1>Accès réservé</h1>
      <p>Les données du cockpit sont chiffrées. Connecte-toi pour les afficher.</p>
      <label for="identifiant">Identifiant</label>
      <input id="identifiant" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label for="mot-de-passe">Mot de passe</label>
      <input id="mot-de-passe" name="password" type="password" autocomplete="current-password" required>
      <label class="case" for="rester"><input id="rester" type="checkbox"> Rester connecté sur cet appareil</label>
      <button type="submit">Se connecter</button>
      <p class="message" id="message-connexion" role="status" aria-live="polite"></p>
    </form>
  </section>

  <main id="app" class="page" hidden></main>

  <footer class="foot page">
    <p>Cockpit AR Conseil · données chiffrées, lisibles uniquement après connexion.</p>
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff">
  <title>Victor</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icone-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Victor">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap">
  <style>
    /* Victor sur le téléphone : on dicte avec le clavier Wispr Flow, Victor exécute (agent ajouter-tache). */
    :root {
      --papier: #ffffff; --papier-2: #f4f3f0; --encre: #1d1c1a; --encre-2: #55534e; --encre-3: #8d8a83; --filet: #ebe9e4;
      --rouge: #d0402a; --a: #204e99; --b: #7a5cf0; --sans: "Geist", -apple-system, system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --papier: #191918; --papier-2: #262624; --encre: #ecebe8; --encre-2: #b5b3ad; --encre-3: #7e7c77; --filet: #2e2e2c; --rouge: #ef7258; color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--papier); color: var(--encre); font: 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
    .page { display: flex; flex-direction: column; height: 100dvh; max-width: 640px; margin: 0 auto; }
    header { display: flex; align-items: center; gap: 12px; padding: calc(14px + env(safe-area-inset-top)) 18px 12px; border-bottom: 1px solid var(--filet); }
    .avatar { flex: none; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; color: #fff; font: 700 17px var(--sans);
      background: linear-gradient(135deg, var(--a), var(--b)); box-shadow: 0 8px 18px -10px #4a3fd0; }
    header h1 { margin: 0; font: 650 18px/1.2 var(--sans); letter-spacing: -.015em; }
    header p { margin: 1px 0 0; font-size: 12.5px; color: var(--encre-3); }
    .cloche { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border: 0; border-radius: 9px; background: linear-gradient(135deg, var(--a), var(--b));
      color: #fff; font: 600 13px var(--sans); cursor: pointer; }
    .cloche svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
    .cloche.active { background: var(--papier-2); color: var(--encre-2); }
    .cloche:not([hidden]) + a { margin-left: 0; }
    header a { margin-left: auto; font-size: 13.5px; color: var(--encre-2); text-decoration: none; padding: 7px 11px; border-radius: 9px; background: var(--papier-2); }

    .fil { flex: 1; overflow-y: auto; padding: 18px 18px 8px; display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; }
    .vide { margin: auto 0; padding: 0 4px 24px; }
    .vide h2 { margin: 0 0 10px; font: 650 26px/1.18 var(--sans); letter-spacing: -.025em; text-wrap: balance; }
    .vide p { margin: 0 0 14px; color: var(--encre-2); font-size: 15px; }
    .vide ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .vide li { padding: 10px 14px; border-radius: 12px; background: var(--papier-2); font-size: 14.5px; color: var(--encre-2); }
    .vide li::before { content: "« "; color: var(--b); } .vide li::after { content: " »"; color: var(--b); }
    .bulle { max-width: 88%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.45; overflow-wrap: anywhere; animation: entre .25s cubic-bezier(.2, .8, .2, 1); }
    @keyframes entre { from { opacity: 0; transform: translateY(6px); } }
    .bulle.moi { align-self: flex-end; background: var(--encre); color: var(--papier); border-bottom-right-radius: 6px; }
    .bulle.victor { align-self: flex-start; background: var(--papier-2); border-bottom-left-radius: 6px; }
    .bulle.victor.erreur { background: color-mix(in srgb, var(--rouge) 10%, var(--papier)); }
    .bulle.victor a { display: inline-block; margin-top: 6px; color: var(--b); font-weight: 600; text-decoration: none; }
    .bulle { white-space: pre-line; }
    .bulle .mails { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; white-space: normal; }
    .bulle .mails li { display: grid; padding: 7px 10px; border-radius: 10px; background: var(--papier); }
    .bulle .mails b { font-size: 14px; } .bulle .mails span { font-size: 12px; color: var(--encre-3); }
    .micro { flex: none; display: grid; place-items: center; width: 52px; height: 52px; border: 0; border-radius: 50%; background: var(--papier-2); color: var(--encre-2); cursor: pointer; }
    .micro svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
    .micro[aria-pressed="true"] { color: #fff; background: linear-gradient(135deg, var(--a), var(--b)); animation: pouls 1.4s ease-in-out infinite; }
    @keyframes pouls { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--b) 18%, transparent); } }
    .bulle time { display: block; margin-top: 3px; font: 500 11px var(--mono); opacity: .55; }
    .attente { align-self: flex-start; display: inline-flex; gap: 4px; padding: 14px 16px; border-radius: 16px; background: var(--papier-2); }
    .attente i { width: 7px; height: 7px; border-radius: 50%; background: var(--encre-3); animation: point 1s ease-in-out infinite; }
    .attente i:nth-child(2) { animation-delay: .15s; } .attente i:nth-child(3) { animation-delay: .3s; }
    @keyframes point { 50% { transform: translateY(-4px); opacity: .5; } }

    form.saisie { position: relative; display: flex; align-items: flex-end; gap: 10px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--filet); background: var(--papier); }
    textarea { flex: 1; min-height: 52px; max-height: 40vh; resize: none; padding: 14px 16px; border: 0; border-radius: 18px; background: var(--papier-2); color: var(--encre);
      font: 450 17px/1.4 var(--sans); outline: none; box-shadow: inset 0 0 0 1.5px transparent; transition: box-shadow .15s; }
    textarea:focus { box-shadow: inset 0 0 0 1.5px var(--b); }
    textarea::placeholder { color: var(--encre-3); }
    .envoyer { flex: none; display: grid; place-items: center; width: 52px; height: 52px; border: 0; border-radius: 50%; color: #fff; cursor: pointer;
      background: linear-gradient(135deg, var(--a), var(--b)); box-shadow: 0 10px 22px -12px #4a3fd0; }
    .envoyer:disabled { opacity: .4; }
    .envoyer svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .compte { position: absolute; left: 0; top: -1px; height: 2px; width: 0; background: linear-gradient(90deg, var(--a), var(--b)); }
    .saisie.decompte .compte { animation: compte var(--duree, 2s) linear forwards; }
    @keyframes compte { to { width: 100%; } }
    .annuler { position: absolute; right: 14px; top: -40px; padding: 7px 12px; border: 0; border-radius: 999px; background: var(--encre); color: var(--papier);
      font: 600 13px var(--sans); display: none; }
    .saisie.decompte .annuler { display: block; }

    .connexion { margin: auto 0; display: grid; gap: 10px; padding: 0 4px 30px; }
    .connexion h2 { margin: 0 0 6px; font: 650 24px/1.2 var(--sans); letter-spacing: -.02em; }
    .connexion input { height: 50px; padding: 0 14px; border: 1px solid var(--filet); border-radius: 12px; background: var(--papier); color: var(--encre); font: 16px var(--sans); }
    .connexion button { height: 50px; border: 0; border-radius: 12px; color: #fff; font: 600 16px var(--sans); background: linear-gradient(135deg, var(--a), var(--b)); }
    .connexion p { margin: 0; min-height: 20px; font-size: 14px; color: var(--rouge); }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <span class="avatar" aria-hidden="true">V</span>
      <div><h1>Victor</h1><p id="etat">Dicte avec Wispr Flow ou le micro</p></div>
      <button type="button" class="cloche" id="cloche" hidden aria-label="Activer les notifications"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span id="cloche-texte">Notifications</span></button>
      <a href="../">Cockpit</a>
    </header>
    <main class="fil" id="fil" aria-live="polite"></main>
    <form class="saisie" id="saisie" hidden>
      <span class="compte" aria-hidden="true"></span>
      <button type="button" class="annuler" id="annuler">Corriger avant l'envoi</button>
      <button type="button" class="micro" id="micro" aria-label="Parler à Victor" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>
      <textarea id="champ" rows="1" enterkeyhint="send" autocapitalize="sentences" placeholder="Dis-le à Victor…" aria-label="Demande pour Victor"></textarea>
      <button type="submit" class="envoyer" id="envoyer" aria-label="Envoyer à Victor"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../assets/config.js"></script>
  <script>
  (function () {
    "use strict";
    var CFG = window.COCKPIT_CONFIG, db = window.supabase.createClient(CFG.url, CFG.cle, { auth: { persistSession: true, autoRefreshToken: true } });
    var fil = document.getElementById("fil"), form = document.getElementById("saisie"), champ = document.getElementById("champ"), etat = document.getElementById("etat");
    var DELAI = 2000, minuterie = null, envoiEnCours = false, CLE = "victor-historique";

    function el(tag, attrs, enfants) {
      var n = document.createElement(tag);
      Object.keys(attrs || {}).forEach(function (k) {
        if (k === "class") n.className = attrs[k]; else if (k === "text") n.textContent = attrs[k];
        else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), attrs[k]); else n.setAttribute(k, attrs[k]);
      });
      (enfants || []).forEach(function (e) { if (e) n.appendChild(typeof e === "string" ? document.createTextNode(e) : e); });
      return n;
    }
    var hm = function (d) { return d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }); };
    function lireHisto() { try { return JSON.parse(localStorage.getItem(CLE) || "[]"); } catch (e) { return []; } }
    function noter(x) { try { var h = lireHisto().concat([x]).slice(-40); localStorage.setItem(CLE, JSON.stringify(h)); } catch (e) { /* stockage indisponible */ } }

    function bulle(x) {
      var lien = x.ouvrir && x.ouvrir.indexOf("https://ar-conseil.github.io/cockpit/") === 0 ? el("a", { href: x.ouvrir, text: "Ouvrir dans le cockpit →" }) : null;
      var mails = (x.mails || []).length ? el("ul", { class: "mails" }, x.mails.map(function (m) {
        return el("li", {}, [el("b", { text: m.objet || "(sans objet)" }), el("span", { text: m.nom + " · " + String(m.de || "").replace(/<[^>]*>/g, "").trim() })]);
      })) : null;
      return el("div", { class: "bulle " + x.qui + (x.erreur ? " erreur" : "") }, [x.texte, mails, lien ? el("br") : null, lien, el("time", { text: hm(new Date(x.le)) })]);
    }
    function vide() {
      return el("div", { class: "vide" }, [
        el("h2", { text: "Parle, Victor s'en charge." }),
        el("p", { text: "Touche le champ en bas, dicte avec le clavier Wispr Flow : ta demande part toute seule deux secondes après." }),
        el("ul", {}, ["Ajoute une tâche pour Palomano : relancer le comptable vendredi", "Rendez-vous avec Arnaud jeudi à 14 h au club",
          "Retrouve le mail de Vincent sur la prévoyance", "Mets à la corbeille le mail suspect Trust Wallet", "Qu'est-ce que j'ai demain ?"].map(function (t) { return el("li", { text: t }); }))
      ]);
    }
    function afficherHisto() {
      fil.textContent = "";
      var h = lireHisto();
      if (!h.length) fil.appendChild(vide()); else h.forEach(function (x) { fil.appendChild(bulle(x)); });
      fil.scrollTop = fil.scrollHeight;
    }
    function ajuster() { champ.style.height = "auto"; champ.style.height = Math.min(champ.scrollHeight, window.innerHeight * .4) + "px"; }

    function annuler() { clearTimeout(minuterie); minuterie = null; form.classList.remove("decompte"); }
    function programmer() {
      annuler();
      if (champ.value.trim().split(/\s+/).length < 2) return;
      form.style.setProperty("--duree", DELAI + "ms"); void form.offsetWidth; form.classList.add("decompte");
      minuterie = setTimeout(envoyer, DELAI);
    }
    function envoyer() {
      annuler();
      var phrase = champ.value.trim();
      if (!phrase || envoiEnCours) return;
      envoiEnCours = true; champ.value = ""; ajuster();
      var moi = { qui: "moi", texte: phrase, le: Date.now() };
      if (!lireHisto().length) fil.textContent = "";
      noter(moi); fil.appendChild(bulle(moi));
      var attente = el("div", { class: "attente", "aria-label": "Victor s'en occupe" }, [el("i"), el("i"), el("i")]);
      fil.appendChild(attente); fil.scrollTop = fil.scrollHeight;
      etat.textContent = "Victor s'en occupe…";
      var fin = function (texte, ok, ouvrir, mails) {
        envoiEnCours = false; attente.remove();
        var v = { qui: "victor", texte: texte, le: Date.now(), erreur: !ok, ouvrir: ouvrir || null,
          mails: (mails || []).slice(0, 4).map(function (m) { return { objet: m.objet, nom: m.nom, de: m.de }; }) };
        noter(v); fil.appendChild(bulle(v)); fil.scrollTop = fil.scrollHeight;
        etat.textContent = ok ? "Fait. Tu peux dicter la suite." : "Rien n'a été fait, réessaie.";
        if (navigator.vibrate) navigator.vibrate(ok ? 30 : [40, 60, 40]);
      };
      var historique = lireHisto().slice(-9, -1).map(function (x) { return { qui: x.qui, texte: x.texte }; });
      db.functions.invoke("assistant", { body: { texte: phrase, historique: historique } }).then(function (r) {
        if (r.error && r.error.context && typeof r.error.context.json === "function")
          return r.error.context.json().then(function (j) { fin(j.texte || j.erreur || r.error.message, false); });
        if (r.error) throw r.error;
        fin(r.data.texte, true, r.data.ouvrir, r.data.mails);
      }).catch(function (e) { fin("Victor n'a pas pu traiter la demande : " + e.message + ". Rien n'a été fait.", false); });
    }

    form.addEventListener("submit", function (ev) { ev.preventDefault(); envoyer(); });
    document.getElementById("annuler").addEventListener("click", function () { annuler(); champ.focus(); });
    // Le clavier Wispr Flow insère la phrase d'un bloc : envoi automatique après DELAI ; une frappe au clavier annule le décompte.
    champ.addEventListener("input", function (ev) {
      ajuster();
      var dicte = ev.inputType === "insertFromPaste" || ev.inputType === "insertReplacementText" || ev.inputType === "insertFromDictation" ||
        (ev.inputType === "insertText" && (ev.data || "").length > 8);
      if (dicte) programmer();
      else if (minuterie) annuler();
    });
    champ.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); envoyer(); }
    });
    // Micro : dictée du navigateur (Safari, Chrome) en français, envoi à la fin ; le clavier Wispr Flow reste possible
    var Reco = window.SpeechRecognition || window.webkitSpeechRecognition, ecoute = null, micro = document.getElementById("micro");
    if (!Reco) micro.hidden = true;
    micro.addEventListener("click", function () {
      if (ecoute) { ecoute.stop(); return; }
      annuler();
      var rec = new Reco(), avant = champ.value.trim(), final = "";
      rec.lang = "fr-FR"; rec.interimResults = true; rec.continuous = false;
      rec.onresult = function (ev) {
        var prov = "";
        for (var i = ev.resultIndex; i < ev.results.length; i++) { if (ev.results[i].isFinal) final += ev.results[i][0].transcript; else prov += ev.results[i][0].transcript; }
        champ.value = [avant, (final + prov).trim()].filter(Boolean).join(" "); ajuster();
      };
      rec.onerror = function (ev) { if (ev.error === "not-allowed" || ev.error === "service-not-allowed") etat.textContent = "Micro refusé : autorise-le dans les réglages de Safari."; };
      rec.onend = function () { ecoute = null; micro.setAttribute("aria-pressed", "false"); etat.textContent = "Dicte avec Wispr Flow ou le micro"; if (final.trim()) programmer(); };
      try { rec.start(); } catch (e) { return; }
      ecoute = rec; micro.setAttribute("aria-pressed", "true"); etat.textContent = "Je t'écoute…";
    });
    fil.addEventListener("click", function (ev) { if (!ev.target.closest("a")) champ.focus(); });

    function connexion() {
      form.hidden = true; fil.textContent = "";
      var email = el("input", { type: "email", autocomplete: "username", placeholder: "E-mail", autocapitalize: "none" });
      var mdp = el("input", { type: "password", autocomplete: "current-password", placeholder: "Mot de passe" });
      var msg = el("p", { role: "alert" });
      fil.appendChild(el("form", { class: "connexion", onsubmit: function (ev) {
        ev.preventDefault(); msg.textContent = "";
        db.auth.signInWithPassword({ email: email.value.trim(), password: mdp.value }).then(function (r) {
          if (r.error) { msg.textContent = "Connexion refusée : vérifier l'e-mail et le mot de passe."; return; }
          pret();
        });
      } }, [el("h2", { text: "Une seule fois sur ce téléphone" }), email, mdp, el("button", { type: "submit", text: "Se connecter" }), msg]));
    }
    // ---------- Notifications : Victor prévient sur ce téléphone quand il a fini une demande (Wispr Flow…) ----------
    var cloche = document.getElementById("cloche"), clocheTexte = document.getElementById("cloche-texte");
    var surIOS = /iPhone|iPad|iPod/.test(navigator.userAgent), installee = window.navigator.standalone || matchMedia("(display-mode: standalone)").matches;
    function base64EnOctets(b) { var p = "=".repeat((4 - b.length % 4) % 4), s = atob((b + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(s, function (c) { return c.charCodeAt(0); }); }
    function etatCloche(actif, texte) { cloche.hidden = false; cloche.classList.toggle("active", !!actif); clocheTexte.textContent = texte; }
    function preparerNotifications() {
      if (!("serviceWorker" in navigator)) return;
      navigator.serviceWorker.register("sw.js").then(function (reg) {
        if (!("PushManager" in window)) { if (surIOS && !installee) etatCloche(false, "Notifications"); return; }
        reg.pushManager.getSubscription().then(function (ab) { etatCloche(!!ab && Notification.permission === "granted", ab && Notification.permission === "granted" ? "Activées" : "Notifications"); });
      });
    }
    cloche.addEventListener("click", function () {
      if (surIOS && !installee) { alert("Pour recevoir les notifications, ouvre Victor depuis son icône sur l'écran d'accueil (Partager › Sur l'écran d'accueil), puis touche à nouveau la cloche."); return; }
      if (cloche.classList.contains("active")) {
        etatCloche(true, "Envoi…");
        db.functions.invoke("notifications", { body: { test: true } }).then(function () { etatCloche(true, "Activées"); });
        return;
      }
      Notification.requestPermission().then(function (perm) {
        if (perm !== "granted") { etatCloche(false, "Refusées"); alert("Notifications refusées : autorise-les dans Réglages › Notifications › Victor."); return; }
        return Promise.all([navigator.serviceWorker.ready, fetch(CFG.url + "/functions/v1/notifications").then(function (r) { return r.json(); })]).then(function (x) {
          if (!x[1].cle_publique) { alert("Les notifications ne sont pas encore prêtes côté cockpit."); etatCloche(false, "Notifications"); return; }
          return x[0].pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: base64EnOctets(x[1].cle_publique) }).then(function (ab) {
            var j = ab.toJSON();
            return db.from("push_abonnements").upsert({ endpoint: j.endpoint, abonnement: j, appareil: navigator.userAgent.slice(0, 120) }).then(function (r) {
              if (r.error) throw r.error;
              etatCloche(true, "Activées");
              return db.functions.invoke("notifications", { body: { test: true } });
            });
          });
        });
      }).catch(function (e) { alert("Activation impossible : " + e.message); etatCloche(false, "Notifications"); });
    });
    function pret() { form.hidden = false; afficherHisto(); champ.focus(); preparerNotifications(); }
    db.auth.getSession().then(function (r) { if (r.data && r.data.session) pret(); else connexion(); });
    document.addEventListener("visibilitychange", function () { if (!document.hidden && !form.hidden) champ.focus(); });
  })();
  </script>
</body>
</html>
